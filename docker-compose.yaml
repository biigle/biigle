services:

  app:
    image: biigle/app-dist
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    depends_on:
      - cache
    tmpfs:
      - /var/www/storage/framework/views:uid=${USER_ID},gid=${GROUP_ID}
    volumes:
      - ./storage:/var/www/storage

  websockets:
    restart: always
    image: biigle/websockets-dist
    ports:
      - 6001:6001

  web:
    image: biigle/web-dist
    restart: always
    depends_on:
      - app
      - websockets
    volumes:
      - type: bind
        source: ./certificate
        target: /etc/letsencrypt/live/example.com
        read_only: true
      - type: bind
        source: ./storage
        target: /var/www/storage
        read_only: true
    ports:
      - 80:80
      - 443:443 # Remove for a setup without SSL
    # Uncomment to use the webserver without SSL:
    # command: nginx -g 'daemon off;' -c /etc/nginx/nginx-no-ssl.conf

  worker:
    image: biigle/worker-dist
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    depends_on:
      - cache
    volumes_from:
      - app
    init: true
    command: "php artisan queue:work --queue=high,default --sleep=5 --tries=3 --timeout=0 --memory=1024"

  pyworker:
    image: ghcr.io/biigle/pyworker
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    volumes_from:
      - app
    init: true
    environment:
      # Services should share the cache directory.
      - TORCH_HOME=storage/largo_cache
      # This is required for much faster CPU processing.
      # See: https://pytorch.org/tutorials/intermediate/torchserve_with_ipex.html
      - OMP_NUM_THREADS=2
    command: "python -u resources/scripts/ExtractFeaturesWorker.py"

  # This is loaded continuously in GPU memory for fast processing. If you need the whole
  # GPU for biigle/maia etc. this can also run on the CPU or a second GPU.
  magic-sam-pyworker:
    image: biigle/gpu-worker-dist
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    deploy:
      resources:
        reservations:
            devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes_from:
      - app
    ipc: host # Required for Torch multiprocessing.
    init: true
    environment:
      # The SAM model type.
      # See: https://github.com/facebookresearch/segment-anything#model-checkpoints
      - SAM_MODEL_TYPE=vit_h
      # URL from which to download the model checkpoint (must match the model type above).
      # Important: The model checkpoint must match with the ONNX file (see config/
      # magic_sam.php)!
      - SAM_MODEL_URL=https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth
    command: "python vendor/biigle/magic-sam/src/resources/scripts/GenerateEmbeddingWorker.py"

  gpu-worker:
    image: biigle/gpu-worker-dist
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    deploy:
      resources:
        reservations:
            devices:
            - driver: nvidia
              capabilities: [gpu]
    depends_on:
      - cache
    volumes_from:
      - app
    ipc: host # Required for Torch multiprocessing.
    init: true
    command: "php artisan queue:work --sleep=5 --tries=1 --timeout=0 gpu --memory=1024"

  scheduler:
    image: biigle/worker-dist
    user: ${USER_ID}:${GROUP_ID}
    restart: always
    depends_on:
      - cache
    volumes_from:
      - app
    command: "/bin/sh -c 'trap exit TERM; while sleep 60 & wait; do php artisan schedule:run >> /dev/null 2>&1; done'"

  database:
    image: ghcr.io/biigle/pgvector
    restart: always
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      - "POSTGRES_DB=biigle"
      - "POSTGRES_USER=biigle"
      - "POSTGRES_PASSWORD=secret"

  cache:
    image: redis:7-alpine
    restart: always

volumes:
  dbdata:
